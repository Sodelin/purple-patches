name: Verify off-phone APK patching tools
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned official Morphe Desktop
        run: |
          curl -fL https://github.com/MorpheApp/morphe-desktop/releases/download/v1.19.1/morphe-desktop-1.19.1-all.jar -o "$RUNNER_TEMP/morphe.jar"
          echo "a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  $RUNNER_TEMP/morphe.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/morphe.jar" --version
          set +e
          java -jar "$RUNNER_TEMP/morphe.jar" patch > "$RUNNER_TEMP/patch-help.txt" 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "Missing required parameter: '<apk>'" "$RUNNER_TEMP/patch-help.txt"
          for option in --validate --exclusive --unsigned --result-file; do
            grep -q -- "$option" "$RUNNER_TEMP/patch-help.txt"
          done
      - name: Inspect exact verified Purple candidate without patching an APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 40528625015 --repo Sodelin/purple-patches --name purple-gboard-candidate --dir "$RUNNER_TEMP/purple-bundle"
          echo "af2077907783247f667940e02659fe8b574ec36fd26df8af67e22469de3f11fe  $RUNNER_TEMP/purple-bundle/patches-0.1.0-alpha.1.mpp" | sha256sum -c -
          java -jar "$RUNNER_TEMP/morphe.jar" list-patches --patches "$RUNNER_TEMP/purple-bundle/patches-0.1.0-alpha.1.mpp" > "$RUNNER_TEMP/patch-list.txt"
          grep -q "Whisper 3 dictation and AI Translate" "$RUNNER_TEMP/patch-list.txt"
          echo "Pinned official CLI loads the exact Purple MPP and exposes bounded validation and unsigned-output flags."
