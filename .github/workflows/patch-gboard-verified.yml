name: Patch and inspect a verified Gboard bundle off phone
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Gboard patch bundle off phone run ID
        required: true
        type: string
      source_commit:
        description: Full source commit of that build
        required: true
        type: string
      version:
        description: Exact version of the main MPP
        required: true
        type: string
      bundle_sha256:
        description: SHA-256 of that exact main MPP
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BUNDLE_VERSION: ${{ inputs.version }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate exact successful source build
        run: |
          python - <<'PY'
          import os, re
          values = os.environ
          for key, pattern in (
              ('BUILD_RUN_ID', r'[0-9]{1,20}'),
              ('SOURCE_COMMIT', r'[0-9a-f]{40}'),
              ('BUNDLE_VERSION', r'[A-Za-z0-9][A-Za-z0-9._-]{0,63}'),
              ('BUNDLE_SHA256', r'[0-9a-f]{64}')):
              if not re.fullmatch(pattern, values[key]):
                  raise SystemExit('Invalid ' + key)
          PY
          gh run view "$BUILD_RUN_ID" --repo Sodelin/purple-patches --json status,conclusion,headSha,workflowName > "$RUNNER_TEMP/build-run.json"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/build-run.json') as f:
              run = json.load(f)
          if (run['status'] != 'completed' or run['conclusion'] != 'success'
              or run['headSha'] != os.environ['SOURCE_COMMIT']
              or run['workflowName'] != 'Build Gboard patch bundle off phone'):
              raise SystemExit('Build run does not match the selected successful source build')
          PY
      - name: Download and verify exact bundle and provenance
        run: |
          gh run download "$BUILD_RUN_ID" --repo Sodelin/purple-patches --name purple-gboard-candidate --dir "$RUNNER_TEMP/purple-bundle"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'purple-bundle'
          version = os.environ['BUNDLE_VERSION']
          main = 'patches-' + version + '.mpp'
          expected = {main, 'patches-' + version + '-sources.mpp',
                      'patches-' + version + '-javadoc.mpp', 'patches-list.json',
                      'patches-bundle.json', 'purple-provenance.json'}
          checks = {}
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split('  ', 1)
              if name in checks or name not in expected:
                  raise SystemExit('Unexpected or duplicate artifact member')
              checks[name] = digest
          if set(checks) != expected:
              raise SystemExit('Incomplete artifact checksum list')
          for name in expected:
              with (root / name).open('rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              if digest != checks[name]:
                  raise SystemExit('Artifact checksum mismatch: ' + name)
          if checks[main] != os.environ['BUNDLE_SHA256']:
              raise SystemExit('Main MPP does not match the selected digest')
          provenance = json.loads((root / 'purple-provenance.json').read_text())
          metadata = json.loads((root / 'patches-bundle.json').read_text())
          if (provenance['overlay_commit'] != os.environ['SOURCE_COMMIT']
              or provenance['version'] != version or metadata['version'] != version):
              raise SystemExit('Artifact provenance/version mismatch')
          PY
      - name: Acquire exact public original APKMirror release
        run: |
          python -m pip install --quiet curl_cffi==0.17.0
          python companion/deployment/fetch-gboard-release.py "$RUNNER_TEMP/gboard-original.apk"
      - name: Verify original Google signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/gboard-original.apk" > "$RUNNER_TEMP/signers.txt"
          grep -q "f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83" "$RUNNER_TEMP/signers.txt"
      - name: Acquire hash-pinned Morphe desktop tool
        run: |
          curl -fL https://github.com/MorpheApp/morphe-desktop/releases/download/v1.19.1/morphe-desktop-1.19.1-all.jar -o "$RUNNER_TEMP/morphe.jar"
          echo "a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  $RUNNER_TEMP/morphe.jar" | sha256sum -c -
      - name: Patch exact target with validated bytecode
        run: |
          java -jar "$RUNNER_TEMP/morphe.jar" patch \
            --patches "$RUNNER_TEMP/purple-bundle/patches-$BUNDLE_VERSION.mpp" \
            --exclusive --enable "Whisper 3 dictation and AI Translate" \
            --enable "Package Rename" --enable "Add Gboard Signature Bypass" \
            --bytecode-mode FULL --validate --unsigned \
            --result-file "$RUNNER_TEMP/gboard-patch-result.json" \
            --out "$RUNNER_TEMP/gboard-purple-unsigned.apk" "$RUNNER_TEMP/gboard-original.apk"
      - name: Verify original preservation and editor checks in output
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$AAPT2" dump badging "$RUNNER_TEMP/gboard-purple-unsigned.apk" > "$RUNNER_TEMP/output-badging.txt"
          "$AAPT2" dump xmltree "$RUNNER_TEMP/gboard-purple-unsigned.apk" --file AndroidManifest.xml > "$RUNNER_TEMP/output-manifest.txt"
          mkdir -p "$RUNNER_TEMP/apk-check" dist
          javac -cp "$RUNNER_TEMP/morphe.jar" -d "$RUNNER_TEMP/apk-check" companion/deployment/VerifyGboardApk.java companion/deployment/VerifyGboardEditorSnapshot.java companion/deployment/VerifyGboardCapture.java companion/deployment/VerifyGboardReadiness.java
          java -cp "$RUNNER_TEMP/apk-check:$RUNNER_TEMP/morphe.jar" VerifyGboardApk "$RUNNER_TEMP/gboard-original.apk" "$RUNNER_TEMP/gboard-purple-unsigned.apk" "$RUNNER_TEMP/output-badging.txt" "$RUNNER_TEMP/output-manifest.txt"
          java -cp "$RUNNER_TEMP/apk-check:$RUNNER_TEMP/morphe.jar" VerifyGboardEditorSnapshot "$RUNNER_TEMP/gboard-purple-unsigned.apk"
          case "$BUNDLE_VERSION" in
            0.1.0-alpha.1|0.1.0-alpha.2|0.1.0-alpha.3) ;;
            *) java -cp "$RUNNER_TEMP/apk-check:$RUNNER_TEMP/morphe.jar" VerifyGboardCapture "$RUNNER_TEMP/gboard-purple-unsigned.apk" ;;
          esac
          case "$BUNDLE_VERSION" in
            0.1.0-alpha.1|0.1.0-alpha.2|0.1.0-alpha.3|0.1.0-alpha.4) ;;
            *) java -cp "$RUNNER_TEMP/apk-check:$RUNNER_TEMP/morphe.jar" VerifyGboardReadiness "$RUNNER_TEMP/gboard-purple-unsigned.apk" ;;
          esac
          cp "$RUNNER_TEMP/gboard-purple-unsigned.apk" "$RUNNER_TEMP/gboard-patch-result.json" "$RUNNER_TEMP/build-run.json" "$RUNNER_TEMP/purple-bundle/purple-provenance.json" dist/
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: purple-gboard-verified-unsigned-candidate
          path: dist/
          retention-days: 7
