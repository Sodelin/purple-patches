name: Build Gboard patch bundle off phone
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gboard/**'
      - 'tools/materialize.py'
      - 'tools/bundle_feed.py'
      - 'tools/check_materialization.py'
      - 'tools/version.txt'
      - '.github/workflows/build.yml'
permissions:
  contents: read
  packages: read
concurrency:
  group: purple-gboard-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # observed v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # observed v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Select existing stable Android 36 platform
        run: |
          java -version
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          sdk=Path(os.environ['ANDROID_HOME']).resolve(strict=True)
          platform=sdk/'platforms'/'android-36'
          jar=platform/'android.jar'
          if not jar.is_file(): raise SystemExit('Existing stable Android 36 platform unavailable')
          with jar.open('rb') as stream:
              digest=hashlib.file_digest(stream,'sha256').hexdigest()
          shim=Path(os.environ['RUNNER_TEMP'])/'purple-sdk-36'
          shim.mkdir()
          for child in sdk.iterdir():
              if child.name!='platforms':(shim/child.name).symlink_to(child,target_is_directory=child.is_dir())
          (shim/'platforms').mkdir()
          (shim/'platforms'/'android-36').symlink_to(platform,target_is_directory=True)
          values={'ANDROID_HOME':str(shim),'ANDROID_SDK_ROOT':str(shim),
                  'PURPLE_ANDROID36_SHA256':digest,'PURPLE_ANDROID36_REAL':str(platform.resolve())}
          if any('\n' in value or '\r' in value for value in values.values()):raise SystemExit('Invalid SDK path')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              for key,value in values.items():env.write(key+'='+value+'\n')
          print(json.dumps({'platform':'android-36','android_jar_sha256':digest,
                            'scope':'Existing runner SDK; no SDK download or phone installation'}))
          PY
      - name: Feed metadata controls
        run: python tools/bundle_feed.py --check
      - name: Pure editor/session policy controls
        run: |
          mkdir -p "$RUNNER_TEMP/purple-policy"
          javac -d "$RUNNER_TEMP/purple-policy" gboard/src/dev/purple/patches/gboard/SessionPolicy.java gboard/src/dev/purple/patches/gboard/CaptureSession.java gboard/src/dev/purple/patches/gboard/WorkerStart.java gboard/SessionPolicyCheck.java gboard/CaptureSessionCheck.java gboard/WorkerStartCheck.java gboard/PurpleNetworkResource.java gboard/PurpleNetworkResourceCheck.java
          java -cp "$RUNNER_TEMP/purple-policy" SessionPolicyCheck
          java -cp "$RUNNER_TEMP/purple-policy" dev.purple.patches.gboard.CaptureSessionCheck
          java -cp "$RUNNER_TEMP/purple-policy" dev.purple.patches.gboard.WorkerStartCheck
          java -cp "$RUNNER_TEMP/purple-policy" dev.purple.patches.gboard.PurpleNetworkResourceCheck
      - name: Materialize pinned mature upstream
        run: |
          git init "$RUNNER_TEMP/gboard-upstream"
          git -C "$RUNNER_TEMP/gboard-upstream" remote add origin https://github.com/jasonwu1994/Gboard-patches
          git -C "$RUNNER_TEMP/gboard-upstream" fetch --depth=1 origin 2eb71854accc7e906d3e4f5495b2a54ed1e2af47
          git -C "$RUNNER_TEMP/gboard-upstream" checkout --detach FETCH_HEAD
          python tools/materialize.py "$RUNNER_TEMP/gboard-upstream"
      - name: Exercise actual materialized access-point hooks
        run: |
          mkdir -p "$RUNNER_TEMP/purple-access-points"
          mapfile -d '' fixtures < <(find gboard/accesspoint-tests -type f -name '*.java' -print0)
          test "${#fixtures[@]}" -gt 0
          javac --release 11 -d "$RUNNER_TEMP/purple-access-points" "${fixtures[@]}" \
            gboard/src/dev/purple/patches/gboard/PurpleAccessPoints.java \
            "$RUNNER_TEMP/gboard-upstream/extensions/extension/src/main/java/dev/jason/gboardpatches/extension/accesspoint/GboardAccessPointContributionsRuntime.java"
          java -cp "$RUNNER_TEMP/purple-access-points" PurpleAccessPointsCheck
      - name: Build and test complete patch source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd "$RUNNER_TEMP/gboard-upstream"
          chmod +x gradlew
          ./gradlew --no-daemon :patches:buildAndroid :patches:generatePatchesList
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          if Path('local.properties').exists():raise SystemExit('Unexpected local.properties SDK override')
          sdk=Path(os.environ['ANDROID_HOME']);platforms=sdk/'platforms'
          candidates=[p for p in platforms.iterdir() if p.is_dir() and (p/'android.jar').exists()]
          if len(candidates)!=1 or candidates[0].name!='android-36':raise SystemExit('Android platform selection changed')
          if str(candidates[0].resolve())!=os.environ['PURPLE_ANDROID36_REAL']:raise SystemExit('Android platform target changed')
          with (candidates[0]/'android.jar').open('rb') as stream:
              if hashlib.file_digest(stream,'sha256').hexdigest()!=os.environ['PURPLE_ANDROID36_SHA256']:
                  raise SystemExit('Android platform bytes changed during build')
          print('Stable Android 36 SDK path and jar remained unchanged; plugin selection is source-derived.')
          PY
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp patches/build/libs/*.mpp "$GITHUB_WORKSPACE/dist/"
          cp patches-list.json patches-bundle.json purple-provenance.json "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # observed v4
        with:
          name: purple-gboard-candidate
          path: dist/
          retention-days: 7
