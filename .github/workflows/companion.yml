name: Verify and cross-build local companion
on:
  workflow_dispatch:
    inputs:
      identity_diagnostic:
        description: Run only the public owner-identity defect reproduction
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: purple-companion
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce the known owner-identity defect only
        if: ${{ inputs.identity_diagnostic }}
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: |
          cargo test --locked --manifest-path companion/Cargo.toml --lib -- \
            --ignored --exact tests::reproduce_live_owner_misidentified_by_updated_command --nocapture
      - name: Native controls without any model invocation
        if: ${{ !inputs.identity_diagnostic }}
        run: |
          mkdir -p dist
          cargo test --locked --manifest-path companion/Cargo.toml --lib > dist/native-controls.txt
      - name: Android cross-build on hosted runner
        if: ${{ !inputs.identity_diagnostic }}
        run: |
          rustup target add aarch64-linux-android
          NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          CARGO_INCREMENTAL=0 cargo build --locked --manifest-path companion/Cargo.toml --release --target aarch64-linux-android --bins
          mkdir -p dist
          cp companion/target/aarch64-linux-android/release/purple-keyboard-bridge dist/
          cp companion/target/aarch64-linux-android/release/natune-journal-check dist/
          cp companion/deployment/purple-gboard-service dist/
          install -m 600 companion/deployment/response-schema.json dist/response-schema.json
          sha256sum companion/Cargo.toml companion/Cargo.lock companion/src/*.rs companion/src/bin/*.rs > dist/source-SHA256SUMS
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.identity_diagnostic }}
        with:
          name: purple-gboard-companion-candidate
          path: dist/
          retention-days: 7
