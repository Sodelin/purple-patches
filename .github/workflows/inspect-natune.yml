name: Inspect exact Natune APK hooks off phone
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: purple-natune-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch public input matching installed bytes
        run: python natune/fetch_target.py "$RUNNER_TEMP/natune-original.apk"
      - name: Verify signature and Android package identity
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/natune-original.apk" > "$RUNNER_TEMP/natune-signers.txt"
          "$AAPT2" dump badging "$RUNNER_TEMP/natune-original.apk" > "$RUNNER_TEMP/natune-badging.txt"
          mkdir -p dist
          "$AAPT2" dump xmltree "$RUNNER_TEMP/natune-original.apk" --file AndroidManifest.xml > dist/target-manifest.xmltree.txt
          python -m unittest discover -s natune -p test_apk_metadata.py -v
          python natune/verify_apk_metadata.py "$RUNNER_TEMP/natune-signers.txt" "$RUNNER_TEMP/natune-badging.txt" > dist/target-proof.json
      - name: Acquire proven hash-pinned DEX reader
        run: |
          curl -fL https://github.com/MorpheApp/morphe-desktop/releases/download/v1.19.1/morphe-desktop-1.19.1-all.jar -o "$RUNNER_TEMP/morphe.jar"
          echo "a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  $RUNNER_TEMP/morphe.jar" | sha256sum -c -
      - name: Inspect release bytecode without loading app classes
        run: |
          mkdir -p "$RUNNER_TEMP/natune-inspector"
          javac -cp "$RUNNER_TEMP/morphe.jar" -d "$RUNNER_TEMP/natune-inspector" natune/*.java natune/test-fixtures/android/net/Uri.java natune/test-fixtures/r8/km2.java
          java -cp "$RUNNER_TEMP/natune-inspector:$RUNNER_TEMP/morphe.jar" OfflineSelectionPlanControls > dist/offline-selection-controls.txt
          java -cp "$RUNNER_TEMP/natune-inspector:$RUNNER_TEMP/morphe.jar" FlacPrefixProbeControls > dist/flac-prefix-controls.txt
          java -cp "$RUNNER_TEMP/natune-inspector:$RUNNER_TEMP/morphe.jar" FlacProbeStreamControls > dist/flac-stream-controls.txt
          java -cp "$RUNNER_TEMP/natune-inspector:$RUNNER_TEMP/morphe.jar" NatuneDataSpecBindingControls > dist/data-spec-controls.txt
          java -cp "$RUNNER_TEMP/natune-inspector:$RUNNER_TEMP/morphe.jar" InspectNatune "$RUNNER_TEMP/natune-original.apk" > dist/policy-hooks.txt
          cd dist
          sha256sum target-proof.json target-manifest.xmltree.txt policy-hooks.txt flac-prefix-controls.txt flac-stream-controls.txt data-spec-controls.txt offline-selection-controls.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: natune-public-hook-inspection
          path: dist/
          retention-days: 14
