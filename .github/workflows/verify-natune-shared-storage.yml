name: Verify Natune shared-folder copy core off phone
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: purple-natune-shared-storage
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and exercise actual stream-copy implementation
        run: |
          mkdir -p "$RUNNER_TEMP/copy-core" dist
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/copy-core" \
            natune/runtime/dev/purple/patches/natune/VerifiedStreamCopy.java \
            natune/NatuneDataSpecBinding.java \
            natune/NatuneDataSpecBindingControls.java \
            natune/test-fixtures/android/net/Uri.java \
            natune/test-fixtures/r8/km2.java \
            natune/runtime/dev/purple/patches/natune/NatuneCachedSource.java \
            natune/runtime/dev/purple/patches/natune/TemporarySpaceBudget.java \
            natune/runtime/dev/purple/patches/natune/NatuneCoroutineStop.java \
            natune/storage-tests/VerifiedStreamCopyControls.java \
            natune/storage-tests/NatuneCachedSourceControls.java \
            natune/storage-tests/TemporarySpaceBudgetControls.java \
            natune/storage-tests/NatuneCoroutineStopControls.java \
            natune/storage-tests/fixtures/r8/*.java
          java -cp "$RUNNER_TEMP/copy-core" VerifiedStreamCopyControls > dist/stream-copy-controls.txt
          java -cp "$RUNNER_TEMP/copy-core" NatuneDataSpecBindingControls > dist/shared-document-request-controls.txt
          java -cp "$RUNNER_TEMP/copy-core" NatuneCachedSourceControls > dist/cache-source-controls.txt
          java -cp "$RUNNER_TEMP/copy-core" TemporarySpaceBudgetControls > dist/temporary-budget-controls.txt
          java -cp "$RUNNER_TEMP/copy-core" NatuneCoroutineStopControls > dist/coroutine-stop-controls.txt
      - name: Exercise pending MediaStore destination with synthetic owner/provider
        run: |
          mkdir -p "$RUNNER_TEMP/media-controls"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/media-controls" \
            natune/runtime/dev/purple/patches/natune/VerifiedStreamCopy.java \
            natune/runtime/dev/purple/patches/natune/MediaStoreAudioDestination.java \
            natune/runtime/dev/purple/patches/natune/NatuneCachedSource.java \
            natune/runtime/dev/purple/patches/natune/TemporarySpaceBudget.java \
            natune/runtime/dev/purple/patches/natune/FlacIntegrity.java \
            natune/runtime/dev/purple/patches/natune/NatuneFolderCopy.java \
            natune/test-fixtures/android/net/Uri.java \
            natune/storage-tests/fixtures/r8/*.java \
            natune/storage-tests/media-fixtures/android/content/*.java \
            natune/storage-tests/media-fixtures/android/database/*.java \
            natune/storage-tests/media-fixtures/android/os/*.java \
            natune/storage-tests/media-fixtures/android/provider/*.java \
            natune/storage-tests/MediaStoreAudioDestinationControls.java \
            natune/storage-tests/NatuneFolderCopyControls.java
          java -cp "$RUNNER_TEMP/media-controls" MediaStoreAudioDestinationControls > dist/media-store-controls.txt
          java -cp "$RUNNER_TEMP/media-controls" NatuneFolderCopyControls > dist/folder-copy-controls.txt
      - name: Compile SAF adapter against real Android SDK
        run: |
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -name android.jar -type f | sort -V | tail -1)"
          test -f "$ANDROID_JAR"
          javac -Xlint:all -Werror -cp "$ANDROID_JAR:$RUNNER_TEMP/copy-core" \
            -d "$RUNNER_TEMP/copy-core" \
            natune/runtime/dev/purple/patches/natune/SharedDocumentDestination.java \
            natune/runtime/dev/purple/patches/natune/MediaStoreAudioDestination.java \
            natune/runtime/dev/purple/patches/natune/NatuneFolderCopy.java \
            natune/runtime/dev/purple/patches/natune/FlacIntegrity.java
          printf '%s\n' 'ANDROID_SAF_COMPILE passed=true device_provider_test=false apk_binding=false' > dist/android-saf-compile.txt
      - uses: actions/checkout@v4
        with:
          repository: xiph/flac
          ref: 1507800de4b70e21be71f38caa0d9079d0bc6e45
          path: public-flac-source
          persist-credentials: false
      - name: Build selected reference decoder and exercise full FLAC verification
        run: |
          test "$(git -C public-flac-source rev-parse HEAD)" = 1507800de4b70e21be71f38caa0d9079d0bc6e45
          cmake -S public-flac-source -B "$RUNNER_TEMP/flac-host" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CXXLIBS=OFF -DBUILD_PROGRAMS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF -DINSTALL_MANPAGES=OFF \
            -DWITH_OGG=OFF -DWITH_ASM=OFF -DENABLE_MULTITHREADING=OFF
          cmake --build "$RUNNER_TEMP/flac-host" --target FLAC --parallel
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" -I public-flac-source/include \
            natune/runtime/native/flac_integrity_jni.c "$RUNNER_TEMP/flac-host/src/libFLAC/libFLAC.a" \
            -lm -o "$RUNNER_TEMP/libpurple_natune_flac.so"
          mkdir -p "$RUNNER_TEMP/flac-classes"
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/flac-classes" \
            natune/runtime/dev/purple/patches/natune/VerifiedStreamCopy.java \
            natune/runtime/dev/purple/patches/natune/FlacIntegrity.java \
            natune/storage-tests/FlacIntegrityControls.java
          cc -std=c11 -Wall -Wextra -Werror -I public-flac-source/include \
            natune/storage-tests/generate-flac-fixture.c "$RUNNER_TEMP/flac-host/src/libFLAC/libFLAC.a" \
            -lm -o "$RUNNER_TEMP/generate-flac-fixture"
          python3 natune/storage-tests/generate-flac-reference-digests.py "$RUNNER_TEMP/flac-fixtures"
          for bits in 4 8 12 16 20 24 31 32; do
            "$RUNNER_TEMP/generate-flac-fixture" "$bits" "$RUNNER_TEMP/flac-fixtures/fixture-$bits.flac"
          done
          java -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/flac-classes" \
            FlacIntegrityControls "$RUNNER_TEMP/flac-fixtures" > dist/flac-integrity-controls.txt
          javac -Xlint:all -Werror -cp "$RUNNER_TEMP/media-controls" -d "$RUNNER_TEMP/media-controls" \
            natune/storage-tests/NatuneFlacFolderCopyControls.java
          java -Djava.library.path="$RUNNER_TEMP/no-flac-library" -cp "$RUNNER_TEMP/media-controls" \
            NatuneFlacFolderCopyControls "$RUNNER_TEMP/flac-fixtures" missing > dist/flac-folder-missing-controls.txt
          java -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/media-controls" \
            NatuneFlacFolderCopyControls "$RUNNER_TEMP/flac-fixtures" > dist/flac-folder-controls.txt
      - name: Cross-build FLAC verifier for Android ARM64
        run: |
          NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cmake -S public-flac-source -B "$RUNNER_TEMP/flac-android" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_CXXLIBS=OFF -DBUILD_PROGRAMS=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF -DINSTALL_MANPAGES=OFF \
            -DWITH_OGG=OFF -DWITH_ASM=OFF -DENABLE_MULTITHREADING=OFF
          cmake --build "$RUNNER_TEMP/flac-android" --target FLAC --parallel
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            -std=c11 -Wall -Wextra -Werror -fPIC -shared -I public-flac-source/include \
            natune/runtime/native/flac_integrity_jni.c "$RUNNER_TEMP/flac-android/src/libFLAC/libFLAC.a" \
            -lm -o dist/libpurple_natune_flac.so
          printf '%s\n' 'xiph/flac 1.5.0 commit 1507800de4b70e21be71f38caa0d9079d0bc6e45; native FLAC only; Android ARM64 API 29' > dist/flac-upstream.txt
          cp public-flac-source/COPYING.Xiph dist/FLAC-LICENSE.txt
      - name: Retain compact public verification
        run: |
          sha256sum natune/runtime/dev/purple/patches/natune/VerifiedStreamCopy.java \
            natune/NatuneDataSpecBinding.java \
            natune/NatuneDataSpecBindingControls.java \
            natune/test-fixtures/android/net/Uri.java \
            natune/test-fixtures/r8/km2.java \
            natune/runtime/dev/purple/patches/natune/SharedDocumentDestination.java \
            natune/runtime/dev/purple/patches/natune/MediaStoreAudioDestination.java \
            natune/runtime/dev/purple/patches/natune/NatuneFolderCopy.java \
            natune/runtime/dev/purple/patches/natune/NatuneCachedSource.java \
            natune/runtime/dev/purple/patches/natune/TemporarySpaceBudget.java \
            natune/runtime/dev/purple/patches/natune/NatuneCoroutineStop.java \
            natune/runtime/dev/purple/patches/natune/FlacIntegrity.java \
            natune/runtime/native/flac_integrity_jni.c \
            natune/storage-tests/FlacIntegrityControls.java \
            natune/storage-tests/NatuneFlacFolderCopyControls.java \
            natune/storage-tests/generate-flac-fixture.c \
            natune/storage-tests/generate-flac-reference-digests.py \
            natune/storage-tests/VerifiedStreamCopyControls.java \
            natune/storage-tests/NatuneCachedSourceControls.java \
            natune/storage-tests/TemporarySpaceBudgetControls.java \
            natune/storage-tests/NatuneCoroutineStopControls.java \
            natune/storage-tests/fixtures/r8/*.java \
            natune/storage-tests/media-fixtures/android/content/*.java \
            natune/storage-tests/media-fixtures/android/database/*.java \
            natune/storage-tests/media-fixtures/android/os/*.java \
            natune/storage-tests/media-fixtures/android/provider/*.java \
            natune/storage-tests/MediaStoreAudioDestinationControls.java \
            natune/storage-tests/NatuneFolderCopyControls.java > dist/source-SHA256SUMS
          cd dist
          sha256sum stream-copy-controls.txt cache-source-controls.txt temporary-budget-controls.txt coroutine-stop-controls.txt media-store-controls.txt folder-copy-controls.txt shared-document-request-controls.txt android-saf-compile.txt flac-integrity-controls.txt flac-folder-controls.txt flac-folder-missing-controls.txt flac-upstream.txt FLAC-LICENSE.txt libpurple_natune_flac.so source-SHA256SUMS > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: natune-shared-storage-controls
          path: dist/
          retention-days: 14
