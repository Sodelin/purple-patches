[package]
name = "purple-keyboard-bridge"
version = "0.2.2-dev.2"
edition = "2021"
description = "Finite authenticated phone-local keyboard adapter for the installed Codex CLI"

[dependencies]
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
signal-hook = "0.4.5"

[profile.release]
overflow-checks = true
strip = true
